{% extends 'core/base.html' %}
{% block title %}
     Manage Transaction
{% endblock %}

{% block body %}
<section class="content">
	<header class="content__title section_title">
		<h3>All Transaction</h3>
	</header>
	<div class="card">
		<div class="border-table">
			<table>
				<thead>
					<tr>
						<th>Customer Name</th>
						<th>Product Name</th>
						<th>Quantity</th>
						<th>Time</th>
						<th colspan="3">Action</th>
					</tr>
				</thead>
				<tbody>
				{% for trans in trans_data %}
					<tr id="transaction_tr_{{trans.id}}">
							<td id="transaction_category_{{trans.id}}">{{trans.category}}</td>
							<td id="transaction_product_{{trans.id}}">{{trans.product}}</td>
							<td id="transaction_quantity_{{trans.id}}">{{trans.quantity}}</td>
							<td id="transaction_createdAt_{{trans.id}}">{{trans.createdAt}}</td>
						<td class="action"><a href="{% url 'delete' trans.id %}" title="Delete"><i class="fas fa-trash text-danger"></i></a></td>
						<td class="action"><a href="#" title="Edit"><i class="fas fa-pencil-alt text-success"></i></a></td>
						<td class="action"><a href="#" title="View"><i class="fas fa-eye text-info"></i></a></td>
					</tr>
				{% endfor %}

				</tbody>
			</table>
		</div>
	</div>
</section>
{% endblock %}
